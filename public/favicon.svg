<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gradBg)" filter="url(#glow)"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- 'S' companion curved path (for Sathi) -->
  <path d="M42 20 C38 15 26 15 23 21 C20 27 34 29 33 36 C32 43 20 44 17 38" 
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI Sparkle Orb on Top Right -->
  <path d="M44 13 L45.5 17.5 L50 19 L45.5 20.5 L44 25 L42.5 20.5 L38 19 L42.5 17.5 Z" 
        fill="url(#gradSpark)"/>

  <!-- Growth dot -->
  <circle cx="45" cy="42" r="3.5" fill="#38bdf8"/>
</svg>
